name: Dennis ❤️ Nadine – Build & Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Project pages live under /<repo>/. Set the repository variable BASE_PATH
          # (e.g. "/") when using a custom domain or a user/organisation page.
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only the default branch is published; other branches just build and test.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
